name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      # The web tests live under web/ but run from the root config, so this one
      # command covers both workspaces.
      - run: npm test

  engines:
    name: shipped CLI runs on the oldest supported node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build on current node. The toolchain is a development concern and has
      # its own floor; what has to work on old node is the artifact users get.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build

      # Then run the built CLI on the version package.json claims to support.
      # Testing the suite here instead would prove nothing about the package:
      # vitest needs node:util styleText and so fails on 18 while the CLI,
      # which imports only fs/os/path/url, is fine.
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: the CLI produces the expected total on node 18
        run: |
          node --version
          node dist/cli.js --root fixtures/projects --json > out.json
          node -e "
            const r = JSON.parse(require('fs').readFileSync('out.json','utf8'));
            const expected = 0.017854;
            if (Math.abs(r.cost.total - expected) > 1e-9) {
              throw new Error('expected ' + expected + ', got ' + r.cost.total);
            }
            if (r.turns !== 7) throw new Error('expected 7 turns, got ' + r.turns);
            console.log('node 18 ok: \$' + r.cost.total + ' across ' + r.turns + ' turns');
          "

  web:
    name: web build
    runs-on: ubuntu-latest
    env:
      # Placeholders. The build only needs these to construct a client; the
      # signed-in routes are dynamic and fetch nothing at build time. Real keys
      # are not required to prove the app compiles, and the publishable key is
      # public by design anyway.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key-for-build-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # web/ compiles against ../dist, so the core has to be built first. Its
      # own prebuild does that, but running it here makes the dependency obvious
      # when this job is the one that fails.
      - run: npm run build
      - run: npm run lint --workspace=web
      - run: npm run build --workspace=web

  pack:
    name: tarball contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Every dollar figure derives from prices.json, and the CLI is useless
      # without it. Shipping a tarball missing it would be a silent break that
      # no unit test can see, because the tests read the file from the repo.
      - name: the tarball ships prices.json and excludes web/
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = JSON.parse(require('fs').readFileSync('pack.json','utf8'))[0].files.map(f => f.path);
            const must = ['prices.json', 'dist/cli.js', 'README.md', 'LICENSE'];
            const missing = must.filter(f => !files.includes(f));
            if (missing.length) throw new Error('tarball is missing: ' + missing.join(', '));
            const leaked = files.filter(f => f.startsWith('web/') || f.endsWith('.test.ts'));
            if (leaked.length) throw new Error('tarball should not contain: ' + leaked.join(', '));
            console.log('tarball ok:', files.length, 'files');
          "
